# XcodeGen spec for the demo app. The generated MotionLibraryDemo.xcodeproj is
# committed, so you only need XcodeGen (`brew install xcodegen`) after editing
# this file: run `xcodegen generate` in this folder.
name: MotionLibraryDemo
options:
  bundleIdPrefix: io.github.bigtsung
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  SwiftUIMotionLibrary:
    path: ../..
targets:
  MotionLibraryDemo:
    type: application
    platform: iOS
    sources: [MotionLibraryDemo]
    dependencies:
      - package: SwiftUIMotionLibrary
        product: MotionLibrary
      - package: SwiftUIMotionLibrary
        product: MotionShaders
      - package: SwiftUIMotionLibrary
        product: MotionGallery
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Motion
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        MARKETING_VERSION: "0.4"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
  MotionLibraryDemoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [MotionLibraryDemoUITests]
    dependencies:
      - target: MotionLibraryDemo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
schemes:
  MotionLibraryDemo:
    build:
      targets:
        MotionLibraryDemo: all
        MotionLibraryDemoUITests: [test]
    test:
      targets: [MotionLibraryDemoUITests]
