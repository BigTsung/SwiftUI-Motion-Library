name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build for macOS
        run: swift build

      - name: Build for iOS
        run: xcodebuild -scheme MotionLibrary-Package -destination 'generic/platform=iOS Simulator' build -quiet

      - name: Generated docs are up to date
        run: Scripts/generate-docs.sh --check

      - name: MCP server answers
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"get_motion_effect","arguments":{"id":"shimmer"}}}' \
            | timeout 10 node mcp/server.mjs | grep -q 'shimmer'
